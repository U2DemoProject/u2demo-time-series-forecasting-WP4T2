repos:
    -   repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
        rev: v0.14.8
        hooks:
        # Run the linter.
        -   id: ruff-check
            args: [--fix]
        # Run the formatter.
        -   id: ruff-format
    -   repo: https://github.com/python-poetry/poetry
        rev: 2.2.1
        hooks:
        -   id: poetry-check
            stages: [pre-commit]
            args: ["--lock"]
        -   id: poetry-lock
            stages: [pre-commit]
    -   repo: https://github.com/python-poetry/poetry-plugin-export
        rev: 1.9.0
        hooks:
        -   id: poetry-export
            stages: [pre-commit]
            args: ["-f", "requirements.txt", "-o", "requirements.txt", "--without-hashes"]
    
    