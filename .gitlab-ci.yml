# Internal GitLab CI pipeline.
#
# This project is developed on an internal GitLab instance and mirrored to
# GitHub for public releases. This file drives the internal pipeline only;
# the public GitHub Actions pipeline lives at .github/workflows/ci.yml.
# Both configurations are intentionally kept in sync.

stages:
  - lint
  - test

variables:
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"


.python_base:
  image: python:3.12-slim
  cache:
    key:
      files:
        - poetry.lock
      prefix: "poetry"
    paths:
      - .poetry-home
      - .venv
  before_script:
    - POETRY_VERSION=$(grep -A1 "python-poetry/poetry$" .pre-commit-config.yaml | grep "rev:" | awk '{print $2}')
    - |
      if [ ! -f .poetry-home/bin/poetry ]; then
        python -m venv .poetry-home
        .poetry-home/bin/pip install poetry==$POETRY_VERSION poetry-plugin-export --quiet
      fi
    - export PATH="$CI_PROJECT_DIR/.poetry-home/bin:$PATH"
    - poetry install --no-root --with dev
    # PyPI's Linux torch wheel is CUDA-enabled (~2.6 GB) so local GPU devs get
    # CUDA by default. CI has no GPU — swap to the CPU wheel at the same lockfile
    # version (keeps autogluon's `torch<2.10` happy, no version drift).
    - TORCH_VERSION=$(grep -A1 '^name = "torch"' poetry.lock | grep version | cut -d'"' -f2)
    - poetry run pip install "torch==${TORCH_VERSION}+cpu" --force-reinstall --index-url https://download.pytorch.org/whl/cpu
    # Purge orphaned CUDA libs (nvidia-*, triton) left behind by the swap above —
    # pip has no dep GC, so they'd otherwise bloat the cached .venv by >2 GB.
    - poetry run pip list --format=freeze | grep -i '^nvidia-' | cut -d= -f1 | xargs -r poetry run pip uninstall -y
    - poetry run pip uninstall -y triton || true
  tags:
    - kvm_runner_1



# lint conventional commits
commitlint:
  image: python:3.12-alpine
  stage: lint
  tags:
    - kvm_runner_1
  only:
    - merge_request
  cache: []
  before_script:
    - apk add --no-cache git
    - GITLINT_VERSION=$(grep -A1 '^name = "gitlint"' poetry.lock | grep version | cut -d'"' -f2)
    - pip install "gitlint==$GITLINT_VERSION" --quiet
  script:
    - |
      echo "Checking MR title: \"$CI_MERGE_REQUEST_TITLE\""
      echo ""
      if ! echo "$CI_MERGE_REQUEST_TITLE" | gitlint; then
        echo ""
        echo "═══════════════════════════════════════════════════════════════════"
        echo "MR title must follow Conventional Commits format:"
        echo ""
        echo "  type(scope): description"
        echo ""
        echo "Examples:"
        echo "  feat(api): add user authentication endpoint"
        echo "  fix(parser): handle empty input gracefully"
        echo "  docs: update installation instructions"
        echo ""
        echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
        echo "Scope is optional. Description should be lowercase and not end with a period."
        echo ""
        echo "To fix: Edit your MR title in GitLab to match this format."
        echo "═══════════════════════════════════════════════════════════════════"
        exit 1
      fi


# Enforce ruff check
ruff_check:
  image: python:3.12-alpine
  stage: lint
  tags:
    - kvm_runner_1
  only:
    - merge_request
  cache: []
  before_script:
    - RUFF_VERSION=$(grep -A1 '^name = "ruff"' poetry.lock | grep version | cut -d'"' -f2)
    - pip install "ruff==$RUFF_VERSION" --quiet
  script:
    - ruff check
    - echo "✓ Ruff check passed with no errors"

# Run ruff format
ruff_format:
  image: python:3.12-alpine
  stage: lint
  tags:
    - kvm_runner_1
  only:
    - merge_request
  cache: []
  before_script:
    - RUFF_VERSION=$(grep -A1 '^name = "ruff"' poetry.lock | grep version | cut -d'"' -f2)
    - pip install "ruff==$RUFF_VERSION" --quiet
  script:
    - ruff format --check
    - echo "✓ Code formatting is correct"

# Check poetry.lock is in sync with pyproject.toml
poetry_lock:
  image: python:3.12-alpine
  stage: lint
  tags:
    - kvm_runner_1
  only:
    - merge_request
  cache: []
  before_script:
    - POETRY_VERSION=$(grep -A1 "python-poetry/poetry$" .pre-commit-config.yaml | grep "rev:" | awk '{print $2}')
    - pip install poetry==$POETRY_VERSION
  script:
    - poetry check --lock


# Run the full test suite on every MR and on main. No skipped markers, no
# branching — auto-merge can't slip past a failing e2e/integration test.
test:
  extends: .python_base
  stage: test
  only:
    - main
    - merge_request
  script:
    - poetry run pytest --cov-fail-under=100
    - echo "✓ All tests passed"
  artifacts:
    when: always
    paths:
      - htmlcov/
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
