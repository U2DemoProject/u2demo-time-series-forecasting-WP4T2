# Public GitHub Actions CI.
#
# This project is developed on an internal GitLab instance and mirrored to
# GitHub for public releases. This workflow drives the public pipeline;
# the internal GitLab pipeline lives at .gitlab-ci.yml. Both are
# intentionally kept in sync.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PYTHON_VERSION: "3.12"

jobs:
  commit-lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get gitlint version from lock file
        id: gitlint-version
        run: |
          VERSION=$(grep -A1 '^name = "gitlint"' poetry.lock | grep version | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: pip install "gitlint==${{ steps.gitlint-version.outputs.version }}"

      - name: Check PR title
        run: echo "${{ github.event.pull_request.title }}" | gitlint --msg-filename /dev/stdin

  ruff-check:
    name: Ruff lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get ruff version from lock file
        id: ruff-version
        run: |
          VERSION=$(grep -A1 '^name = "ruff"' poetry.lock | grep version | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: pip install "ruff==${{ steps.ruff-version.outputs.version }}"
      - run: ruff check

  ruff-format:
    name: Ruff format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get ruff version from lock file
        id: ruff-version
        run: |
          VERSION=$(grep -A1 '^name = "ruff"' poetry.lock | grep version | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: pip install "ruff==${{ steps.ruff-version.outputs.version }}"
      - run: ruff format --check

  poetry-lock:
    name: Poetry lock check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get Poetry version from pre-commit config
        id: poetry-version
        run: |
          VERSION=$(grep -A1 "python-poetry/poetry$" .pre-commit-config.yaml | grep "rev:" | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: pip install "poetry==${{ steps.poetry-version.outputs.version }}"
      - run: poetry check --lock

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reclaim ~30 GB on ubuntu-latest by removing preinstalled toolchains we
      # don't use. Without this the runner runs out of space during install.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get Poetry version from pre-commit config
        id: poetry-version
        run: |
          VERSION=$(grep -A1 "python-poetry/poetry$" .pre-commit-config.yaml | grep "rev:" | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Poetry
        run: pip install "poetry==${{ steps.poetry-version.outputs.version }}" poetry-plugin-export

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      # lightning was removed from PyPI due to a security vulnerability.
      # autogluon-timeseries requires it, but only uses lightning.pytorch which
      # is identical to pytorch-lightning. Pre-install our local stub so Poetry
      # finds lightning already satisfied and skips the PyPI download entirely.
      - name: Pre-install lightning compatibility stub
        run: poetry run pip install vendor/lightning/ --force-reinstall --no-deps

      - run: poetry install --no-root --with dev

      # PyPI's Linux torch wheel is CUDA-enabled (~2.6 GB) so local GPU devs get
      # CUDA by default. CI has no GPU — swap to the CPU wheel at the same lockfile
      # version (keeps autogluon's `torch<2.10` happy, no version drift).
      - name: Get torch version from lock file
        id: torch-version
        run: |
          VERSION=$(grep -A1 '^name = "torch"' poetry.lock | grep version | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: poetry run pip install "torch==${{ steps.torch-version.outputs.version }}+cpu" --force-reinstall --index-url https://download.pytorch.org/whl/cpu

      # Purge orphaned CUDA libs (nvidia-*, triton) left behind by the swap above —
      # pip has no dep GC, so they'd otherwise bloat the cached .venv by >2 GB.
      - run: poetry run pip list --format=freeze | grep -i '^nvidia-' | cut -d= -f1 | xargs -r poetry run pip uninstall -y
      - run: poetry run pip uninstall -y triton || true

      - run: poetry run pytest --cov-fail-under=100

      - name: Extract coverage percentage
        id: coverage
        if: always()
        run: |
          COVERAGE=$(poetry run coverage report --format=total 2>/dev/null) || COVERAGE="0"
          echo "total=$COVERAGE" >> "$GITHUB_OUTPUT"

      # Pushes coverage % to a GitHub Gist so shields.io can render a badge.
      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && always()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.total }}%
          valColorRange: ${{ steps.coverage.outputs.total }}
          minColorRange: 50
          maxColorRange: 90

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
            report.xml
