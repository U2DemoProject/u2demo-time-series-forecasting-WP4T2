[project]
name = "u2"
version = "0.1.0"
description = "Time Series Prediction Algorithm Implementation for U2 Demo Project"
authors = [
    {name = "Isaac Boates",email = "isaac.boates@eifer.org"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch (>=2.2,<2.8)",
    "fire (>=0.7.1,<0.8.0)",
    "numpy (>=1.25.0,<2.3.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "autogluon[timeseries] (>=1.4.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.8,<0.15.0)",
    "ruff-lsp (>=0.0.62,<0.0.63)"
]
