[project]
name = "u2demo-time-series-forecasting"
version = "0.2.0"
description = "Time Series Forecasting Algorithm Implementation for U2Demo Project"
authors = [
    {name = "Isaac Boates",email = "isaac.boates@eifer.org"},
    {name = "Maxime Gatineau",email = "maxime.gatineau@eifer.org"},
    {name = "Hubert Kriebitzsch", email = "hubert.kriebitzsch@eifer.org"},
    {name = "Jaisiel Santana",email = "jaisiel.santana@eifer.org"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = [
    "time-series",
    "forecasting",
    "autogluon",
    "pytorch",
    "energy",
    "machine-learning",
    "u2demo",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch (>=2.2,<3.0)",
    "fire (>=0.7.1,<0.8.0)",
    "numpy (>=1.25.0,<2.3.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "lightning (==2.5.1)",
    "autogluon-timeseries (>=1.5.0,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.0,<3.0)",
]

[project.urls]
Homepage = "https://u2demo.eu/"
Repository = "https://github.com/U2DemoProject/u2demo-time-series-forecasting-wp4t2"
Issues = "https://github.com/U2DemoProject/u2demo-time-series-forecasting-wp4t2/issues"
Documentation = "https://github.com/U2DemoProject/u2demo-time-series-forecasting-wp4t2#readme"

[project.scripts]
u2demo-forecast = "u2demo_time_series_forecasting.cli:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.9,<0.16.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "gitlint (>=0.19.1,<0.20.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pyright (>=1.1.408,<2.0.0)",
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)"
]
examples = [
    "ucimlrepo (>=0.0.7,<0.0.8)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "ipywidgets (>=8.1.8,<9.0.0)"
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.examples]
optional = true

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.coverage.run]
source = ["u2demo_time_series_forecasting"]
omit = ["u2demo_time_series_forecasting/core/logger.py"]

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.pyright]
include = ["u2demo_time_series_forecasting"]
exclude = ["tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
