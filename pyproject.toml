[project]
name = "u2"
version = "0.1.0"
description = "Time Series Prediction Algorithm Implementation for U2 Demo Project"
authors = [
    {name = "Isaac Boates",email = "isaac.boates@eifer.org"},
    {name = "Maxime Gatineau",email = "maxime.gatineau@eifer.org"},
    {name = "Hubert Kriebitzsch", email = "hubert.kriebitzsch@eifer.org"},
    {name = "Jaisiel Santana",email = "jaisiel.santana@eifer.org"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch (>=2.2,<2.8)",
    "fire (>=0.7.1,<0.8.0)",
    "numpy (>=1.25.0,<2.3.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "lightning (==2.5.1)",
    "autogluon (>=1.5.0,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.8,<0.15.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "gitlint (>=0.19.1,<0.20.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
examples = [
    "ucimlrepo (>=0.0.7,<0.0.8)",
    "ipykernel (>=7.2.0,<8.0.0)"
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.coverage.run]
source = ["u2"]
omit = ["u2/logging_config.py"]

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"