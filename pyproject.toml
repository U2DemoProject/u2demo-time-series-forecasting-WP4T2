[project]
name = "u2"
version = "0.1.0"
description = "Time Series Prediction Algorithm Implementation for U2 Demo Project"
authors = [
    {name = "Isaac Boates",email = "isaac.boates@eifer.org"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch (>=2.9.1,<3.0.0)",
    "fire (>=0.7.1,<0.8.0)",
    "numpy (>=2.3.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
